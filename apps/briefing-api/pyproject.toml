[project]
name = "news-intelligence-backend"
version = "0.1.0"
description = "WDTS daily news dashboard backend for AI, casino tech, and semiconductor signals."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.13.3",
    "beautifulsoup4==4.12.3",
    "celery==5.4.0",
    "feedparser==6.0.11",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "boto3==1.35.36",
    "lxml==5.3.0",
    "psycopg[binary]>=3.2.3,<3.3",
    "pydantic-settings==2.5.2",
    "python-dateutil==2.9.0.post0",
    "redis==5.1.1",
    "sqlalchemy==2.0.35",
    "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
]

[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
